# For a self-hosted VPS deploy (Railway/Fly.io instead use their own
# per-service builds from backend/Dockerfile and frontend/Dockerfile against
# a managed Postgres — see docs/architecture.md "Deployment"). This variant
# adds restart policies and drops the public Postgres port.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: support_copilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
    env_file:
      - ../backend/.env.production
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/support_copilot
      LLM_PROVIDER: api
      ENVIRONMENT: prod
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
    ports:
      - "4173:4173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
