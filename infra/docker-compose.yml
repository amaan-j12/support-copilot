# Full containerized stack. Requires LLM_PROVIDER=api (with a real API key)
# in backend/.env — the claude_cli adapter needs an authenticated `claude`
# CLI on PATH, which these containers don't have. For the $0-cost CLI-adapter
# dev workflow, run Postgres from here but run the backend on the host — see
# the root README's "Local development" section.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: support_copilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
    env_file:
      - ../backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/support_copilot
      LLM_PROVIDER: api
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
    ports:
      - "4173:4173"
    depends_on:
      - backend

volumes:
  pgdata:
