# Railway deploys backend/ and frontend/ as two separate services, each
# built from its own Dockerfile, plus a managed Postgres plugin (with
# `CREATE EXTENSION vector;` run once via its query console). This file
# documents the backend service's build/start; create the frontend service
# the same way pointed at frontend/Dockerfile.
#
# Required backend service variables (Railway dashboard, not committed):
#   DATABASE_URL     — from the Postgres plugin
#   LLM_PROVIDER      = api
#   LLM_MODEL         = anthropic/claude-sonnet-4-5  (or any litellm model id)
#   ANTHROPIC_API_KEY
#   LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY (optional)

[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"

[deploy]
startCommand = "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
